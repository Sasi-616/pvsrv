        <button type="button" class="fb-btn-action" id="btnSoundToggle" title="Toggle Page Flip Sound">

          </svg>

    <!-- 3D Book Stage -->
    <main class="fb-stage-wrapper" id="flipbookStage">
      <!-- 3D Book is mounted here by flipbook.js -->
    </main>

    <!-- Collapsible Visual Filmstrip Drawer -->
    <div id="readerFilmstripDrawer" style="display:none; position:fixed; bottom:64px; left:0; width:100%; background:rgba(12,14,18,0.95); backdrop-filter:blur(10px); border-top:1px solid rgba(202,160,91,0.3); z-index:90; padding:0.6rem 1.5rem; box-shadow:0 -10px 25px rgba(0,0,0,0.5);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
        <span style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.12em; color:#caa05b; font-weight:700; display:inline-flex; align-items:center; gap:0.4rem;">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
          <span>Page-by-Page Segregation Filmstrip</span>
        </span>
        <button type="button" style="background:none; border:none; color:#8492a6; cursor:pointer; display:flex; align-items:center;" onclick="document.getElementById('readerFilmstripDrawer').style.display='none'">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div id="readerFilmstripMount"></div>
    </div>

    <!-- Bottom Controls Dock -->
    <footer class="fb-dock">
      <div class="fb-dock-left">
        <button type="button" class="fb-dock-btn" id="dockBtnPrev" title="Previous Page (Left Arrow)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button type="button" class="fb-dock-btn" id="dockBtnNext" title="Next Page (Right Arrow / Spacebar)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <div class="fb-page-slider-wrap">
        <input type="range" class="fb-slider" id="fbPageSlider" min="0" max="9" value="0">
        <span class="fb-page-indicator" id="fbPageIndicator">Cover (Page 1 of 10)</span>
      </div>

      <div class="fb-dock-right">
        <!-- Zoom Out -->
        <button type="button" class="fb-dock-btn" id="btnZoomOut" title="Zoom Out">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>
        <!-- Zoom In -->
        <button type="button" class="fb-dock-btn" id="btnZoomIn" title="Zoom In">

            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>

        </button>

  <!-- Table of Contents Modal -->
  <dialog class="fb-modal-dialog" id="tocModal">
    <div class="fb-modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-family:'Playfair Display', serif; font-size:1.35rem; color:#fff;">Table of Contents</h3>
        <button type="button" style="background:none; border:none; color:#8492a6; cursor:pointer; font-size:1.25rem;" onclick="document.getElementById('tocModal').close()">✕</button>
      </div>
      <p style="font-size:0.85rem; color:#8492a6; margin-top:0.35rem;">Click any chapter to flip directly to its spread:</p>
      <ul class="fb-toc-list" id="tocItemsList">
        <!-- Injected via JS -->
      </ul>
    </div>
  </dialog>

  <!-- PDF Upload Loading Overlay -->
  <div id="pdfLoadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); z-index:9999; flex-direction:column; align-items:center; justify-content:center; color:#fff;">
    <div style="width:48px; height:48px; border:3px solid rgba(202,160,91,0.3); border-top-color:#caa05b; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:1.5rem;"></div>
    <h3 style="font-family:'Playfair Display', serif; font-size:1.4rem; color:#caa05b; margin-bottom:0.5rem;">Processing PDF into 3D Flipbook...</h3>
    <p style="font-size:0.9rem; color:#cbd5e1;" id="pdfLoadingText">Extracting high-resolution pages and generating 3D sheets...</p>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Scripts -->
  <script src="/js/content-bridge.js"></script>
  <script src="/js/flipbook.js"></script>
  <script>
    (function () {
      'use strict';

      // Parse initial book slug from server or URL param
      const urlParams = new URLSearchParams(window.location.search);
      const initialBookKey = urlParams.get('book') || "{{ $currentSlug ?? 'people-before-process' }}";

      // Initialize 3D FlipBook
      const book = new PVS_FlipBook('flipbookStage', {
        bookKey: initialBookKey,
        sound: true,
        onPageChange: (current, total) => {
          // Handled internally in updateControls
        }
      });

      book.mountFilmstrip('readerFilmstripMount');

      // Segregated Page Jump Handlers
      document.getElementById('btnJumpCover')?.addEventListener('click', () => book.jumpToPage(0));
      document.getElementById('btnJumpSpreads')?.addEventListener('click', () => book.jumpToPage(1));
      document.getElementById('btnJumpBackCover')?.addEventListener('click', () => {
        if (book.pages) book.jumpToPage(book.pages.length - 1);
      });

      // Toggle Filmstrip Drawer
      document.getElementById('btnToggleFilmstrip')?.addEventListener('click', () => {
        const drawer = document.getElementById('readerFilmstripDrawer');
        if (drawer) {
          const isHidden = drawer.style.display === 'none' || !drawer.style.display;
          drawer.style.display = isHidden ? 'block' : 'none';
          if (isHidden) book.renderFilmstrip();
        }
      });

      // Synchronize book selector dropdown
      const bookSelector = document.getElementById('bookSelector');
      if (bookSelector) {
        bookSelector.value = initialBookKey;
        bookSelector.addEventListener('change', (e) => {
          const key = e.target.value;
          book.loadBook(key);
          const topTitle = document.getElementById('topBookTitle');
          if (topTitle && book.currentBook) {
            topTitle.textContent = book.currentBook.title;
          }
        });
      }

      // Dock buttons
      document.getElementById('dockBtnNext')?.addEventListener('click', () => book.flipNext());
      document.getElementById('dockBtnPrev')?.addEventListener('click', () => book.flipPrev());

      // Slider navigation
      const slider = document.getElementById('fbPageSlider');
      if (slider) {
        slider.addEventListener('input', (e) => {
          book.jumpToPage(parseInt(e.target.value, 10));
        });
      }

      // Zoom controls
      let zoomLevel = 1.0;
      document.getElementById('btnZoomIn')?.addEventListener('click', () => {
        zoomLevel = Math.min(1.4, zoomLevel + 0.1);
        book.setZoom(zoomLevel);
      });
      document.getElementById('btnZoomOut')?.addEventListener('click', () => {
        zoomLevel = Math.max(0.8, zoomLevel - 0.1);
        book.setZoom(zoomLevel);
      });

      // Sound toggle
      const btnSound = document.getElementById('btnSoundToggle');
      const soundIcon = document.getElementById('soundIcon');
      if (btnSound && soundIcon) {
        btnSound.addEventListener('click', () => {
          const enabled = book.toggleSound();
          soundIcon.innerHTML = enabled
            ? `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg><span>Sound On</span>`
            : `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg><span>Sound Off</span>`;
          btnSound.classList.toggle('active', enabled);
        });
      }

      // Fullscreen toggle
      document.getElementById('btnFullscreen')?.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => console.warn(err));
        } else {
          document.exitFullscreen();
        }
      });

      // Table of Contents Modal
      const tocBtn = document.getElementById('btnTOC');
      const tocModal = document.getElementById('tocModal');
      const tocList = document.getElementById('tocItemsList');

      if (tocBtn && tocModal && tocList) {
        tocBtn.addEventListener('click', () => {
          tocList.innerHTML = '';
          book.pages.forEach((p, idx) => {
            if (p.title || p.chapter) {
              const li = document.createElement('li');
              li.className = 'fb-toc-item';
              li.innerHTML = `
                <span>${p.chapter ? `<strong>${p.chapter}:</strong> ` : ''}${p.title || 'Chapter Spread'}</span>
                <span style="font-size:0.75rem; color:#caa05b; text-transform:uppercase;">Page ${idx + 1}</span>
              `;
              li.addEventListener('click', () => {
                tocModal.close();
                book.jumpToPage(idx);
              });
              tocList.appendChild(li);
            }
          });
          tocModal.showModal();
        });
      }

      // PDF Upload Handler
      const uploadBtn = document.getElementById('btnUploadPDF');
      const fileInput = document.getElementById('pdfFileInput');
      const overlay = document.getElementById('pdfLoadingOverlay');

      if (uploadBtn && fileInput && overlay) {
        uploadBtn.addEventListener('click', () => {
          fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file || file.type !== 'application/pdf') {
            alert('Please select a valid PDF document.');
            return;
          }

          overlay.style.display = 'flex';
          const topTitle = document.getElementById('topBookTitle');
          if (topTitle) topTitle.textContent = file.name.replace(/\.[^/.]+$/, "");

          book.loadCustomPDF(file, (numPages) => {
            overlay.style.display = 'none';
            alert(`Successfully rendered ${numPages} PDF pages into 3D Flipbook! Use arrow keys or click corners to flip.`);
          });
        });
      }

      // Drag & Drop PDF
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          const file = e.dataTransfer.files[0];
          if (file.type === 'application/pdf' && overlay) {
            overlay.style.display = 'flex';
            const topTitle = document.getElementById('topBookTitle');
            if (topTitle) topTitle.textContent = file.name.replace(/\.[^/.]+$/, "");
            book.loadCustomPDF(file, (numPages) => {
              overlay.style.display = 'none';
              alert(`Successfully rendered ${numPages} PDF pages into 3D Flipbook!`);
            });
          }
        }
      });

    })();
  </script>
</body>
